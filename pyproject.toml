[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constraintos"
version = "0.1.0"
description = "Source-aware event planning from raw messages"
requires-python = ">=3.11"
dependencies = ["groq>=0.30,<2", "pydantic>=2.10,<3", "streamlit>=1.42,<2"]

[tool.setuptools.packages.find]
include = ["constraintos*"]
